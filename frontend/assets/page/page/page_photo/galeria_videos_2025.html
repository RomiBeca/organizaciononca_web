    <!-- HERO -->
    <header class="galeria-hero d-flex justify-content-center align-items-center">
      <div class="container text-center text-white" style="position:relative;z-index:1">
        <h1 class="fw-bold display-4">Videos 2025</h1>

        <div class="d-flex gap-2 justify-content-center mt-3 flex-wrap">
          <a href="galeria_2025.html" class="btn btn-outline-light btn-sm">📸 Ver Fotografías</a>
          <a href="galeria_seleccion_2025.html" class="btn btn-outline-light btn-sm">← Volver a 2025</a>

    <!-- VIDEOS -->
    <section class="py-5">
      <div class="container">
        <div class="row g-4" id="videos-container">
          <p class="text-center text-body-secondary" id="videos-loading">Cargando videos…</p>
        </div>
      </div>
    </section>

    <!-- MODAL VIDEO -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" style="max-width:860px">
        <div class="modal-content border-0 overflow-hidden" style="background:#0d0d0d;border-radius:18px">

          <!-- Cabecera -->
          <div class="d-flex align-items-center justify-content-between px-3 pt-2 pb-1">
            <h6 class="text-white fw-bold mb-0 text-truncate me-2" id="videoModalTitle" style="max-width:80%"></h6>
            <div class="d-flex align-items-center gap-2 flex-shrink-0">
              <small id="videoCounter" class="text-white-50"></small>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
          </div>

          <!-- Video + flechas -->
          <div class="d-flex align-items-center" style="background:#000">
            <button id="modalPrev" class="btn border-0 text-white flex-shrink-0 d-flex align-items-center justify-content-center"
              style="background:rgba(255,255,255,0.1);width:52px;min-height:100%;font-size:2.4rem;line-height:1;transition:background .2s,transform .15s;border-radius:0 0 0 18px"
              onmouseover="this.style.background='rgba(255,193,7,0.25)';this.style.transform='scale(1.08)'"
              onmouseout="this.style.background='rgba(255,255,255,0.1)';this.style.transform='scale(1)'"
              aria-label="Video anterior">&#8249;</button>

            <div style="flex:1;aspect-ratio:16/9;position:relative">
              <iframe id="videoModalIframe" src=""
                allowfullscreen allow="autoplay; encrypted-media"
                title="Video"
                style="position:absolute;inset:0;width:100%;height:100%;border:none">
              </iframe>
            </div>

            <button id="modalNext" class="btn border-0 text-white flex-shrink-0 d-flex align-items-center justify-content-center"
              style="background:rgba(255,255,255,0.1);width:52px;min-height:100%;font-size:2.4rem;line-height:1;transition:background .2s,transform .15s;border-radius:0 0 18px 0"
              onmouseover="this.style.background='rgba(255,193,7,0.25)';this.style.transform='scale(1.08)'"
              onmouseout="this.style.background='rgba(255,255,255,0.1)';this.style.transform='scale(1)'"
              aria-label="Video siguiente">&#8250;</button>
          </div>

        </div>
      </div>
    </div>

    <!-- FOOTER -->

      <div class="container text-center">
        <p class="mb-2">Organização Onça © 2026</p>
        <a href="https://instagram.com/organizacaooncaschile" target="_blank" rel="noopener noreferrer" class="text-warning" aria-label="Instagram @organizacaooncaschile">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073z"/></svg>
        </a>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/ui.js"></script>

    <script>
      let ytVideos = [];       // solo los de YouTube (tienen modal)
      let currentIdx = 0;

      function cargarModal(idx) {
        const v = ytVideos[idx];
        currentIdx = idx;
        document.getElementById('videoModalTitle').textContent = v.titulo;
        document.getElementById('videoModalIframe').src =
          `https://www.youtube.com/embed/${v.embed_id}?autoplay=1&rel=0`;
        document.getElementById('videoCounter').textContent =
          ytVideos.length > 1 ? `${idx + 1} / ${ytVideos.length}` : '';
        // Ocultar flechas si hay un solo video
        const mostrar = ytVideos.length > 1 ? '' : 'none';
        document.getElementById('modalPrev').style.display = mostrar;
        document.getElementById('modalNext').style.display = mostrar;
      }

      (async () => {
        const container = document.getElementById('videos-container');

        try {
          const res = await fetch('../../data/videos.json');
          if (!res.ok) throw new Error();
          const todos = await res.json();
          const videos = todos.filter(v => v.año === 2025);

          // Índices separados para YouTube (los únicos que van al modal)
          let ytIdx = 0;

          if (!videos.length) {
            container.innerHTML = `
              <div class="col-12 text-center py-5">
                <p class="display-1 mb-3">🎥</p>
                <h4 class="fw-bold">Próximamente</h4>
                <p class="text-body-secondary">Los videos del 2025 estarán aquí pronto.</p>
              </div>`;
            return;
          }

          container.innerHTML = videos.map(v => {
            if (v.plataforma === 'youtube') {
              const i = ytIdx++;
              ytVideos.push(v);
              return `
                <div class="col-md-6 col-lg-4">
                  <div class="video-card video-yt-trigger" role="button" data-yt-index="${i}" style="cursor:pointer">
                    <div class="ratio ratio-16x9 position-relative overflow-hidden">
                      <img
                        src="https://img.youtube.com/vi/${v.embed_id}/hqdefault.jpg"
                        alt="${v.titulo}"
                        style="object-fit:cover;width:100%;height:100%;display:block"
                        loading="lazy"
                      />
                      <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center"
                        style="background:rgba(0,0,0,0.3)">
                        <div style="width:58px;height:58px;background:rgba(255,0,0,0.88);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,0.5)">
                          <svg width="24" height="24" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                      </div>
                    </div>
                    <div class="video-card-body">
                      <span class="video-plataforma-badge yt-badge">YouTube</span>
                      <h5 class="video-titulo">${v.titulo}</h5>
                      ${v.descripcion ? `<p class="video-desc">${v.descripcion}</p>` : ''}
                    </div>
                  </div>
                </div>`;
            } else {
              return `
                <div class="col-md-6 col-lg-4">
                  <div class="video-card">
                    <div class="video-ig-cover">
                      <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073z"/></svg>
                    </div>
                    <div class="video-card-body">
                      <span class="video-plataforma-badge ig-badge">Instagram</span>
                      <h5 class="video-titulo">${v.titulo}</h5>
                      ${v.descripcion ? `<p class="video-desc">${v.descripcion}</p>` : ''}
                      <a href="${v.url}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-warning fw-bold mt-2">
                        Ver en Instagram ↗
                      </a>
                    </div>
                  </div>
                </div>`;
            }
          }).join('');

        } catch {
          container.innerHTML = `
            <div class="col-12 text-center py-5">
              <p class="text-body-secondary">No se pudieron cargar los videos.</p>
            </div>`;
        }
      })();

      // Abrir modal al hacer clic en una card de YouTube
      document.getElementById('videos-container').addEventListener('click', e => {
        const card = e.target.closest('.video-yt-trigger');
        if (!card) return;
        cargarModal(parseInt(card.dataset.ytIndex));
        bootstrap.Modal.getOrCreateInstance(document.getElementById('videoModal')).show();
      });

      // Flechas de navegación
      document.getElementById('modalPrev').addEventListener('click', () => {
        document.getElementById('videoModalIframe').src = '';
        setTimeout(() => cargarModal((currentIdx - 1 + ytVideos.length) % ytVideos.length), 80);
      });
      document.getElementById('modalNext').addEventListener('click', () => {
        document.getElementById('videoModalIframe').src = '';
        setTimeout(() => cargarModal((currentIdx + 1) % ytVideos.length), 80);
      });

      // Detener video al cerrar
      document.getElementById('videoModal').addEventListener('hide.bs.modal', () => {
        document.getElementById('videoModalIframe').src = '';
      });
    </script>
  </body>
